name: Build

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: Install dependencies
        run: pacman -Syu --noconfirm --needed base-devel git qt6-base qt6-declarative qt6-wayland

      - uses: actions/checkout@v4

      - name: Test
        run: bin/test

      - name: Package
        run: |
          useradd -m builder
          chown -R builder .
          cd pkgbuild
          sudo -u builder makepkg -f --noconfirm
          rm -f tokentally-debug-*.pkg.tar.zst

      - uses: actions/upload-artifact@v4
        with:
          name: tokentally-package
          path: pkgbuild/*.pkg.tar.zst

      - name: Attach package to release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pacman -S --noconfirm --needed github-cli
          git config --global --add safe.directory "$PWD"
          gh release upload "$GITHUB_REF_NAME" pkgbuild/tokentally-*.pkg.tar.zst --clobber
